app = "flake-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FLAKE_DEMO_FAKE = "1"
  FLAKE_DEMO_PACE = "1.0"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false      # state lives in this process; never suspend it
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/api/state"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
