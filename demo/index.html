<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flake — Demo</title>
<style>
:root{
  --bg:#f4f4f1; --panel:#fff; --ink:#191917; --muted:#6b6b64; --line:#e2e2dc;
  --chat-bg:#eceae4; --mine:#d6f2c8; --theirs:#fff;
  --green:#0b5d4f; --search:#1d6fb8; --amber:#b57700; --amber-bg:#fdf3e0;
  --red:#b3261e; --red-bg:#fdecea; --violet:#5b4bbd;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  font-synthesis-weight:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
button{font:inherit;cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* ---------- top bar ---------- */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.02em;font-size:16px;color:var(--green)}
.stage{font-weight:600}
.stage small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);background:#fafaf7;font-size:12px;font-weight:600}
.chip b{font-weight:700}
.chip.canary{background:var(--amber-bg);border-color:#f0dcae;color:var(--amber)}
.chip.active{background:#e6f4ee;border-color:#c2e3d6;color:var(--green)}
.chip.probation{background:#eef1f6;border-color:#d8dfea;color:#3f5a80}
.chip.rejected{background:var(--red-bg);border-color:#f3cfcb;color:var(--red)}
.spacer{flex:1}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.warn{border-color:#f0dcae;background:var(--amber-bg);color:var(--amber)}
.bell{position:relative}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--amber);color:#fff;border-radius:999px;
  font-size:10px;padding:1px 5px}
.tabs{display:none;gap:6px}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:12px;padding:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel h2{margin:0;padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}

/* ---------- chat ---------- */
#chat{display:flex;flex-direction:column;height:calc(100vh - 86px);min-height:520px}
#msgs{flex:1;overflow:auto;padding:14px;background:var(--chat-bg);display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;max-width:88%}
.msg.right{align-self:flex-end;flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:999px;flex:0 0 28px;color:#fff;font-weight:700;font-size:12px;
  display:grid;place-items:center;margin-top:auto}
.bubble{background:var(--theirs);border-radius:12px;padding:7px 10px;box-shadow:0 1px 1px rgba(0,0,0,.07)}
.msg.right .bubble{background:var(--mine)}
.who{font-size:11px;font-weight:700;margin-bottom:2px}
.sys{align-self:center;background:#e2ded4;color:#5c584c;font-size:11.5px;padding:4px 10px;border-radius:8px;text-align:center}
.card{border-left:3px solid var(--green);padding-left:8px}
.card b{display:block}
.card.receipt{border-color:var(--search)}
.card div{color:var(--muted);font-size:12.5px}
.rsvp{display:grid;gap:3px;min-width:190px}
.rsvp .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.rsvp .yes{color:var(--green);font-weight:700}
.rsvp .no{color:var(--red);font-weight:700}
.approval{border:1px solid #f0dcae;background:var(--amber-bg);border-radius:12px;padding:10px;max-width:92%;align-self:center;width:100%}
.approval .q{font-weight:600;margin-bottom:8px}
.approval .acts{display:flex;gap:8px}
.approval .acts button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--amber);background:#fff;
  color:var(--amber);font-weight:700}
.approval .acts button.ok{background:var(--green);border-color:var(--green);color:#fff}
.approval .tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);font-weight:700;margin-bottom:4px}
#composer{padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;background:#fafaf7;
  border-radius:0 0 var(--radius) var(--radius)}

/* ---------- diagram ---------- */
.node rect{fill:#fff;stroke:var(--line);stroke-width:1.5}
.node text{font-size:12.5px;font-weight:600;fill:var(--ink)}
.node tspan.sub{font-size:10.5px;font-weight:400;fill:var(--muted)}
.node.on rect{stroke-width:2.5;stroke:var(--green);fill:#f1f9f5}
.node.sel rect{stroke:var(--violet);stroke-width:2.5}
.node.ask.on rect{stroke:var(--amber);fill:var(--amber-bg)}
.node.deny.on rect,.node.reject.on rect{stroke:var(--red);fill:var(--red-bg)}
.node.db.on rect{stroke:var(--search);fill:#eef5fc}
.edge{stroke:#cfcfc7;stroke-width:1.8;fill:none;marker-end:url(#ar)}
.edge.on{stroke:var(--green);stroke-width:2.6;marker-end:url(#arOn);stroke-dasharray:7 5;
  animation:flow .6s linear infinite}
.edge.hero{stroke-dasharray:6 6}
.edge.hero.on{stroke:var(--violet);marker-end:url(#arHero);stroke-width:3.2}
@keyframes flow{to{stroke-dashoffset:-24}}
.lane{fill:#faf9f6;stroke:var(--line);stroke-dasharray:4 4}
.laneLabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted);font-weight:700}
svg{display:block;width:100%;height:auto}

/* ---------- feed + inspector ---------- */
.lower{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
#feed{max-height:330px;overflow:auto}
.ev{display:flex;gap:9px;padding:7px 12px;border-bottom:1px solid #f1f1ec;cursor:pointer;align-items:flex-start}
.ev:hover{background:#faf9f6}
.ev.sel{background:#f2f0fb;box-shadow:inset 3px 0 0 var(--violet)}
.ev .dot{width:7px;height:7px;border-radius:999px;background:var(--green);margin-top:6px;flex:0 0 7px}
.ev.db .dot{background:var(--search)} .ev.model .dot{background:var(--violet)}
.ev.ask .dot{background:var(--amber)} .ev.deny .dot,.ev.reject .dot{background:var(--red)}
.ev .txt{flex:1;font-size:12.5px}
.ev .meta{color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.ev .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#insp{padding:12px 14px;max-height:330px;overflow:auto}
#insp .t{font-weight:700;margin-bottom:6px}
#insp .note{margin-top:10px;padding:8px 10px;background:#faf9f6;border-left:3px solid var(--line);
  color:var(--muted);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #f1f1ec;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
pre{margin:0;background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:9px;overflow:auto;
  font-size:11.5px;line-height:1.5}
ul.reasons{margin:0;padding-left:18px} ul.reasons li{margin:3px 0;font-size:12.5px}
.diffrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:baseline;padding:4px 0;
  border-bottom:1px solid #f1f1ec;font-size:12px}
.diffrow .old{color:var(--red);text-decoration:line-through}
.diffrow .new{color:var(--green);font-weight:700}
.empty{color:var(--muted);font-size:12.5px}
.live{margin-left:auto;display:flex;gap:6px}
.live button{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700}
.live button.on{background:var(--green);border-color:var(--green);color:#fff}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  .tabs{display:flex}
  body.t-agent #chat{display:none} body.t-chat #right{display:none}
  #chat{height:auto;min-height:0;max-height:calc(100vh - 150px)}
  .lower{grid-template-columns:1fr}
}
</style>
</head>
<body class="t-chat">
<header>
  <span class="brand">Flake</span>
  <span class="stage" id="stage">—<small id="stageSub"></small></span>
  <span class="chip" id="polChip">policy <b>—</b></span>
  <span class="chip" id="canChip">canary <b>—</b></span>
  <span class="spacer"></span>
  <span class="tabs">
    <button class="btn" data-tab="chat">Chat</button>
    <button class="btn" data-tab="agent">Agent</button>
  </span>
  <button class="btn warn bell" id="bell" hidden>Approval waiting<b>1</b></button>
  <button class="btn primary" id="next">Next Beat</button>
  <button class="btn" id="reset">Reset Demo</button>
</header>

<main>
  <section class="panel" id="chat">
    <h2>Taco Council <span class="chip" style="font-weight:600">5 members</span></h2>
    <div id="msgs"></div>
    <div id="composer">Messages come from the demo script — no composer in this version.</div>
  </section>

  <div id="right">
    <section class="panel">
      <h2>Agent · planning loop and learning loop</h2>
      <svg viewBox="0 0 980 360" role="img" aria-label="Flake agent diagram">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#cfcfc7"/></marker>
          <marker id="arOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0b5d4f"/></marker>
          <marker id="arHero" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b4bbd"/></marker>
        </defs>
        <rect class="lane" x="14" y="14" width="952" height="132" rx="10"/>
        <text class="laneLabel" x="28" y="34">Planning</text>
        <rect class="lane" x="14" y="196" width="952" height="132" rx="10"/>
        <text class="laneLabel" x="28" y="216">Learning</text>

        <!-- planning edges -->
        <path id="e_memory_agent"   class="edge" d="M196 88 H264"/>
        <path id="e_agent_gate"     class="edge" d="M416 88 H484"/>
        <path id="e_gate_tools"     class="edge" d="M636 88 H704"/>
        <path id="e_tools_agent"    class="edge" d="M784 62 C784 26 340 26 340 58"/>
        <!-- plan → learn -->
        <path id="e_tools_outcomes" class="edge" d="M784 114 C784 170 116 170 116 236"/>
        <!-- learning edges -->
        <path id="e_outcomes_risk"  class="edge" d="M196 266 H244"/>
        <path id="e_risk_proposal"  class="edge" d="M356 266 H404"/>
        <path id="e_proposal_backtest" class="edge" d="M516 266 H564"/>
        <path id="e_backtest_policy"  class="edge" d="M676 266 H744"/>
        <!-- the money shot: policy governs the gate -->
        <path id="e_policy_gate" class="edge hero" d="M824 240 C824 170 560 190 560 118"/>

        <g class="node" id="n_memory"  data-node="memory"><rect x="46" y="60" width="150" height="56" rx="9"/><text x="121" y="84" text-anchor="middle">Memory<tspan class="sub" x="121" dy="16">episodes · vectors</tspan></text></g>
        <g class="node" id="n_agent"   data-node="agent"><rect x="266" y="60" width="150" height="56" rx="9"/><text x="341" y="84" text-anchor="middle">Agent<tspan class="sub" x="341" dy="16">LangGraph turns</tspan></text></g>
        <g class="node" id="n_gate"    data-node="gate"><rect x="486" y="60" width="150" height="56" rx="9"/><text x="561" y="84" text-anchor="middle">Gate<tspan class="sub" x="561" dy="16">allow · modify · ask · deny</tspan></text></g>
        <g class="node" id="n_tools"   data-node="tools"><rect x="706" y="60" width="150" height="56" rx="9"/><text x="781" y="84" text-anchor="middle">Tools<tspan class="sub" x="781" dy="16">book · money · chat</tspan></text></g>

        <g class="node" id="n_outcomes" data-node="outcomes"><rect x="46" y="238" width="150" height="56" rx="9"/><text x="121" y="262" text-anchor="middle">Outcomes<tspan class="sub" x="121" dy="16">who showed · cost</tspan></text></g>
        <g class="node" id="n_risk"     data-node="risk"><rect x="246" y="238" width="110" height="56" rx="9"/><text x="301" y="262" text-anchor="middle">Risk<tspan class="sub" x="301" dy="16">profiles</tspan></text></g>
        <g class="node" id="n_proposal" data-node="proposal"><rect x="406" y="238" width="110" height="56" rx="9"/><text x="461" y="262" text-anchor="middle">Proposal<tspan class="sub" x="461" dy="16">underwriter</tspan></text></g>
        <g class="node" id="n_backtest" data-node="backtest"><rect x="566" y="238" width="110" height="56" rx="9"/><text x="621" y="262" text-anchor="middle">Backtest<tspan class="sub" x="621" dy="16">replay</tspan></text></g>
        <g class="node" id="n_policy"   data-node="policy"><rect x="746" y="238" width="150" height="56" rx="9"/><text x="821" y="262" text-anchor="middle">Policy<tspan class="sub" x="821" dy="16">versions · constitution</tspan></text></g>
      </svg>
    </section>

    <div class="lower">
      <section class="panel">
        <h2>Activity
          <span class="live">
            <button id="liveBtn" class="on">Live</button>
          </span>
        </h2>
        <div id="feed"></div>
      </section>
      <section class="panel">
        <h2>Inspector</h2>
        <div id="insp"><div class="empty">Select an activity row to inspect its evidence.</div></div>
      </section>
    </div>
  </div>
</main>

<script src="script.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const STEP = 620;               // ms between events in a beat
let beat = -1, events = [], sel = null, live = true, pending = null, running = false, blocked = false;
let session = 0, timer = null;

// ---------- rendering ----------
function chatMsg(m) {
  const box = $("#msgs");
  if (m.from === "system") {
    box.insertAdjacentHTML("beforeend", `<div class="sys">${esc(m.text)}</div>`);
  } else {
    const p = PEOPLE[m.from], mine = m.from === "alex";
    let body = "";
    if (m.card) body = `<div class="card ${m.card.tone || ""}"><b>${esc(m.card.title)}</b>${m.card.lines.map(l => `<div>${esc(l)}</div>`).join("")}</div>`;
    else if (m.rsvps) body = `<div class="rsvp">${m.rsvps.map(([who, r]) => `<div class="row"><span>${PEOPLE[who].name}</span><span class="${r}">${r}</span></div>`).join("")}</div>`;
    else body = esc(m.text);
    box.insertAdjacentHTML("beforeend",
      `<div class="msg ${mine ? "right" : ""}"><div class="av" style="background:${p.color}">${p.initials}</div>
       <div class="bubble">${mine ? "" : `<div class="who" style="color:${p.color}">${p.name}</div>`}${body}</div></div>`);
  }
  box.scrollTop = box.scrollHeight;
}

function askApproval(ev) {
  pending = { ...ev.approval, ev };
  const bell = $("#bell"); bell.hidden = false;
  $("#next").disabled = true;
  $("#msgs").insertAdjacentHTML("beforeend",
    `<div class="approval" id="ap_${pending.id}">
       <div class="tag">Approval needed · ${esc(pending.tool)}</div>
       <div class="q">${esc(pending.question)}</div>
       <div class="acts"><button class="ok" data-ap="ok">Approve</button><button data-ap="no">Decline</button></div>
     </div>`);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}

function resolveApproval(ok) {
  if (!pending) return;                         // each request is consumed once
  const p = pending, mySession = session; pending = null;
  const card = document.getElementById("ap_" + p.id);
  if (card) card.outerHTML = `<div class="sys">${ok ? "Alex approved" : "Alex declined"} ${esc(p.tool)} · ${esc(p.id)}</div>`;
  $("#bell").hidden = true;
  if (ok) {
    push({ node: "gate", kind: "allow", label: `approval ${p.id} granted — ${p.tool} retried through the gate`,
      detail: { kind: "json", title: "approvals", value: { id: p.id, tool: p.tool, decision: "approve", by: "alex" },
        note: "The tool call resumes on the existing gate retry path; the approval is recorded on the episode." } });
    play(mySession);                            // continue the rest of the beat
  } else {
    push({ node: "gate", kind: "deny", label: `approval ${p.id} declined — ${p.tool} not executed`,
      detail: { kind: "reasons", title: "Decision", rows: [`${p.tool} was declined by Alex; the gate returns deny and the plan stops here`],
        note: "This beat is only partly executed. Reset the demo before continuing." } });
    chatMsg({ from: "flake", text: "Understood — I won't book it. Nothing was charged." });
    blocked = true; running = false; paint();
  }
}

function push(ev) {
  ev.i = events.length;
  ev.ts = new Date().toLocaleTimeString([], { hour12: false });
  ev.beat = BEATS[beat] ? BEATS[beat].title : "—";
  events.push(ev);
  const prev = events[ev.i - 1];
  const row = document.createElement("div");
  row.className = "ev " + (ev.kind || "info");
  row.dataset.i = ev.i;
  row.innerHTML = `<span class="dot"></span><span class="txt">${esc(ev.label)}
    <div class="meta">${ev.ts} · ${esc(ev.beat)} · ${esc(ev.node)}${ev.detail ? "" : " · no detail"}</div></span>`;
  row.onclick = () => select(ev.i, true);
  $("#feed").appendChild(row);
  if (ev.chat) chatMsg(ev.chat);
  highlight(ev, prev);
  if (live) { select(ev.i, false); $("#feed").scrollTop = $("#feed").scrollHeight; }
}

function highlight(ev, prev) {
  document.querySelectorAll(".node").forEach(n => n.classList.remove("on", "db", "model", "ask", "deny", "reject"));
  document.querySelectorAll(".edge").forEach(e => e.classList.remove("on"));
  const n = document.getElementById("n_" + ev.node);
  if (n) { n.classList.add("on"); n.classList.add(ev.kind || "info"); }
  if (ev.lane === "hero") document.getElementById("e_policy_gate").classList.add("on");
  if (prev && prev.node !== ev.node) {
    const e = document.getElementById(`e_${prev.node}_${ev.node}`);
    if (e) e.classList.add("on");
  }
}

function detailHTML(d) {
  if (!d) return `<div class="empty">No inspector detail recorded for this event.</div>`;
  let body = "";
  if (d.kind === "table") body = `<table><thead><tr>${d.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${d.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  else if (d.kind === "json") body = `<pre class="mono">${esc(JSON.stringify(d.value, null, 2))}</pre>`;
  else if (d.kind === "reasons") body = `<ul class="reasons">${d.rows.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
  else if (d.kind === "diff") body = d.rows.map(([k, a, b]) =>
    `<div class="diffrow"><span class="mono">${esc(k)}</span><span class="old">${esc(a)}</span><span>→</span><span class="new">${esc(b)}</span></div>`).join("");
  return (d.title ? `<div class="t">${esc(d.title)}</div>` : "") + body + (d.note ? `<div class="note">${esc(d.note)}</div>` : "");
}

function select(i, byUser) {
  sel = i;
  if (byUser) { live = false; $("#liveBtn").classList.remove("on"); }   // inspection survives new events
  document.querySelectorAll(".ev").forEach(r => r.classList.toggle("sel", +r.dataset.i === i));
  const ev = events[i];
  $("#insp").innerHTML = detailHTML(ev.detail);
  document.querySelectorAll(".node").forEach(n => n.classList.toggle("sel", n.dataset.node === ev.node));
}

function paint() {
  const b = BEATS[beat], nb = BEATS[beat + 1];
  $("#stage").innerHTML = b ? `${esc(b.title)}<small>${esc(b.subtitle)}</small>`
                            : `Not started<small>press Next Beat to seed the baseline</small>`;
  const pol = b ? (b.policyAfter || b.policy) : null;
  $("#polChip").innerHTML = `policy <b>${pol ? esc(pol.label) : "—"}</b>`;
  $("#polChip").className = "chip " + (pol ? pol.status : "");
  const canary = pol && pol.status === "canary";
  $("#canChip").innerHTML = `canary <b>${canary ? "on trial" : pol && pol.label === "v2" ? "promoted" : "none"}</b>`;
  $("#canChip").className = "chip " + (canary ? "canary" : "");
  const n = $("#next");
  n.disabled = running || !!pending || blocked || !nb;
  n.textContent = blocked ? "Reset required"
    : running ? "Playing…"
    : nb ? `Next Beat${beat < 0 ? "" : " · " + nb.title}` : "Demo complete";
}

// ---------- driving ----------
function play(mySession) {
  running = true; paint();
  const b = BEATS[beat];
  const step = () => {
    if (mySession !== session) return;                  // a reset orphans this run
    const ev = b.events[b.cursor++];
    if (!ev) { running = false; paint(); return; }
    push(ev);
    if (ev.approval) { running = false; askApproval(ev); paint(); return; }
    timer = setTimeout(step, STEP);
  };
  timer = setTimeout(step, 120);
}

function nextBeat() {
  if (running || pending || blocked) return;
  beat++;
  if (!BEATS[beat]) return;
  BEATS[beat].cursor = 0;
  paint();
  play(session);
}

function reset() {
  session++; clearTimeout(timer);
  running = false; pending = null; blocked = false; beat = -1; events = []; sel = null; live = true;
  BEATS.forEach(b => b.cursor = 0);
  $("#msgs").innerHTML = ""; $("#feed").innerHTML = "";
  $("#insp").innerHTML = `<div class="empty">Select an activity row to inspect its evidence.</div>`;
  $("#bell").hidden = true; $("#liveBtn").classList.add("on");
  document.querySelectorAll(".node").forEach(n => n.setAttribute("class", "node"));
  document.querySelectorAll(".edge").forEach(e => e.classList.remove("on"));
  paint();
  nextBeat();                                           // beat 0 is the baseline seed
}

$("#next").onclick = nextBeat;
$("#reset").onclick = reset;
$("#liveBtn").onclick = () => { live = !live; $("#liveBtn").classList.toggle("on", live);
  if (live && events.length) select(events.length - 1, false); };
$("#bell").onclick = () => { document.body.className = "t-chat";
  document.getElementById("ap_" + (pending && pending.id))?.scrollIntoView({ block: "center" }); };
$("#msgs").addEventListener("click", e => {
  const b = e.target.closest("[data-ap]"); if (b) resolveApproval(b.dataset.ap === "ok");
});
document.querySelectorAll("[data-tab]").forEach(t => t.onclick = () => document.body.className = "t-" + t.dataset.tab);
document.querySelectorAll(".node").forEach(n => n.onclick = () => {
  for (let i = events.length - 1; i >= 0; i--) if (events[i].node === n.dataset.node) return select(i, true);
});
addEventListener("keydown", e => { if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); nextBeat(); } });
if (innerWidth > 900) document.body.className = "";
reset();
</script>
</body>
</html>
